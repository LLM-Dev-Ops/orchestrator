# Cloud Build configuration for LLM-Orchestrator
# Unified service deployment to Google Cloud Run

substitutions:
  _SERVICE_NAME: llm-orchestrator
  _REGION: us-central1
  _PLATFORM_ENV: dev
  _SERVICE_VERSION: '0.1.5'
  _IMAGE_TAG: 'latest'  # Override with --substitutions=_IMAGE_TAG=xxx

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${_IMAGE_TAG}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${_PLATFORM_ENV}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'
      - '--cache-from'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    timeout: '1200s'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}'
    waitFor: ['build']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${_IMAGE_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300s'
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'PLATFORM_ENV=${_PLATFORM_ENV},SERVICE_NAME=${_SERVICE_NAME},SERVICE_VERSION=${_SERVICE_VERSION}'
      - '--set-secrets'
      - 'RUVECTOR_SERVICE_URL=ruvector-service-url:latest,RUVECTOR_API_KEY=ruvector-api-key:latest,TELEMETRY_ENDPOINT=observatory-endpoint:latest'
      - '--service-account'
      - '${_SERVICE_NAME}-sa@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--labels'
      - 'service=${_SERVICE_NAME},env=${_PLATFORM_ENV}'
    waitFor: ['push']

  # Step 4: Verify deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Verifying deployment..."
        SERVICE_URL=$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
        echo "Service URL: $${SERVICE_URL}"

        # Health check
        curl -sf "$${SERVICE_URL}/health" || echo "Health endpoint not yet available"

        echo "Deployment verification complete"
    waitFor: ['deploy']

images:
  - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${_IMAGE_TAG}'
  - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${_PLATFORM_ENV}'
  - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'

timeout: '1800s'

tags:
  - 'llm-orchestrator'
  - '${_PLATFORM_ENV}'
