name: Proxy Response Boundary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proxy-response-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
      - run: node --check functions/index.js
      - run: node functions/test.js
      - run: node tests/proxy-response-probe.cjs .
      - run: node tests/proxy-redirect-probe.cjs .
